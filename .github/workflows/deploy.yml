name: Deploy

on:
  push:
    branches:
      - modpack/master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest
      - name: Build
        run: |
          rm -rf build
          mkdir -p build
          cd misc/prismSource
          zip -r ../../build/JAMS.zip *
          cd ../../
          cp -r config build || true
          cp -r mods build || true
          cp index.toml build || true
          cp pack.toml build || true
          cd mod
          ./gradlew runDatagen
          ./gradlew build
          cd ../build
          cp ../mod/build/libs/*.jar mods/
          rm mods/*-sources.jar || true
          rm mods/*-javadoc.jar || true
          packwiz refresh --build
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        id: deployment
        with:
          path: build
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
